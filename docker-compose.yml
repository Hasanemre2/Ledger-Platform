version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ledger_kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: '4L622nShTWWkrFuMm5IGqA'

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ledger_kafka_init
    depends_on:
      - kafka
    entrypoint: [ "bash", "-c" ]
    command: |
      "
      # Kafka broker'ının hazır olmasını bekle
      cub kafka-ready -b kafka:9092 1 30
      # Topic oluştur (6 partition - Consumer scaling testi için)
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ledger-transactions --partitions 6 --replication-factor 1
      echo 'Topic ledger-transactions hazır!'
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ledger_kafka_ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: ledger-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: ledger_oracle
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-LedgerAdmin2024}
      APP_USER: ${ORACLE_APP_USER:-LEDGER_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-LedgerPass2024}
    volumes:
      - ledger_oracle_data:/opt/oracle/oradata
      - ./init-scripts:/container-entrypoint-initdb.d

volumes:
  ledger_oracle_data: